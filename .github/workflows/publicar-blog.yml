name: Publicar blog

# Publica os artigos agendados (blog/src/*.json com "date" no futuro) quando o dia chega.
on:
  schedule:
    - cron: "5 11 * * *"   # todo dia às 8h05 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o blog
        run: python3 tools/blog.py build
      - name: Commit, se algo mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Alexandre Leite"
            git config user.email "alexandreaugusto145@gmail.com"
            git add -A
            git commit -m "Blog: publica artigo agendado ($(TZ=America/Sao_Paulo date +%F))"
            git push
          else
            echo "Nenhum artigo novo para hoje."
          fi
